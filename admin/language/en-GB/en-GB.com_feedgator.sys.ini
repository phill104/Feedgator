; Submenu item labels also need to live here, not just in
; en-GB.com_feedgator.ini - the admin Components menu is built from
; .sys.ini before the component is ever dispatched, so keys that only
; exist in the regular language file show up untranslated until the
; component has been opened at least once in that session (which loads
; the regular file and Joomla caches the translation from then on).
